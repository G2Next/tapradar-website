name: TapRadar CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tapradar-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - name: Audit production dependencies
        run: |
          audit_output=/tmp/tapradar-npm-audit.json
          for attempt in 1 2 3; do
            if npm audit --omit=dev --audit-level=high --json \
              --fetch-retries=2 \
              --fetch-retry-mintimeout=2000 \
              --fetch-retry-maxtimeout=10000 \
              --fetch-timeout=30000 > "$audit_output"; then
              cat "$audit_output"
              exit 0
            fi
            if node -e 'const fs=require("fs");try{const report=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));process.exit(report.metadata?.vulnerabilities?0:1)}catch{process.exit(1)}' "$audit_output"; then
              cat "$audit_output"
              echo "High or critical dependency vulnerabilities found."
              exit 1
            fi
            if [ "$attempt" -eq 3 ]; then
              cat "$audit_output"
              echo "npm audit service unavailable after 3 attempts; failing closed."
              exit 1
            fi
            echo "npm audit service unavailable; retrying ($attempt/3)..."
            sleep $((attempt * 5))
          done
      - name: Report development dependency advisories
        continue-on-error: true
        run: npm audit --include=dev --audit-level=high

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Start local Supabase
        run: npx --yes supabase@latest start
      - name: Rebuild and lint database
        run: |
          npx --yes supabase@latest db reset --local
          npx --yes supabase@latest db lint --local
      - name: Test email events and admin permissions
        run: npm run test:email
      - name: Stop local Supabase
        if: always()
        run: timeout 60s npx --yes supabase@latest stop --no-backup || true
