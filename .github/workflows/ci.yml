name: TapRadar CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tapradar-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - name: Audit dependencies
        run: |
          audit_output=/tmp/tapradar-npm-audit.json
          for attempt in 1 2 3; do
            if npm audit --audit-level=high --json \
              --fetch-retries=2 \
              --fetch-retry-mintimeout=2000 \
              --fetch-retry-maxtimeout=10000 \
              --fetch-timeout=30000 > "$audit_output"; then
              cat "$audit_output"
              exit 0
            fi
            if node -e 'const fs=require("fs");try{const report=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));process.exit(report.metadata?.vulnerabilities?0:1)}catch{process.exit(1)}' "$audit_output"; then
              cat "$audit_output"
              echo "High or critical dependency vulnerabilities found."
              exit 1
            fi
            if [ "$attempt" -eq 3 ]; then
              cat "$audit_output"
              echo "::warning::npm audit service unavailable after 3 attempts; tests, lint and build passed."
              exit 0
            fi
            echo "npm audit service unavailable; retrying ($attempt/3)..."
            sleep $((attempt * 5))
          done

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Start local Supabase
        run: npx --yes supabase@latest start
      - name: Rebuild and lint database
        run: |
          npx --yes supabase@latest db reset --local
          npx --yes supabase@latest db lint --local
      - name: Stop local Supabase
        if: always()
        run: npx --yes supabase@latest stop --no-backup
